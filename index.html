<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cuentas de Vale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one-screen phone app — sticky period header, scrolling ledger body, fixed tab bar + floating add button */
/* Layout: app de una columna para el celular — tarjeta principal deslizable (COP/USD), secciones plegables, barra de pestañas fija. Paleta nude y café; gráficas en verde azulado, coral, ciruela, mostaza y azul (validadas para daltonismo). */
:root {
  --bg: #f6eee6; --surface: #fffbf7; --surface-2: #efe3d7; --ink: #2a1d16; --ink-2: #5c4a3f; --muted: #8b776a; --line: #e6d8cb;
  --accent: #6b432e; --accent-ink: #fff8f1; --accent-soft: #efdfd1;
  --hero-a: #8a5a3f; --hero-b: #3d2a20; --hero-ink: #fcf1e7; --hero-mut: #e6cfbd; --hero-line: rgb(255 240 225 / .18);
  --pos: #2f7a55; --neg: #b23a32; --warn: #8a5300; --warn-soft: #f7e6c8; --seq: #008f7a; --other: #b3a194;
  --s-ing: #008f7a; --s-fijos: #e0613d; --s-var: #8d4fa3; --s-aho: #b97f00; --s-deu: #2f7fc4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17110e; --surface: #241b16; --surface-2: #2f241e; --ink: #f4e9df; --ink-2: #d0bdb0; --muted: #9c8a7d; --line: #3b2e26;
  --accent: #d9a67c; --accent-ink: #1d1410; --accent-soft: #3a2a20;
  --hero-a: #6a4430; --hero-b: #2a1d16; --hero-ink: #fbefe4; --hero-mut: #d6bfad; --hero-line: rgb(255 240 225 / .14);
  --pos: #6cc196; --neg: #f08a7e; --warn: #f2b65a; --warn-soft: #3a2c12; --seq: #1a9d90; --other: #6e5e53;
  --s-ing: #1a9d90; --s-fijos: #e06a44; --s-var: #a46aba; --s-aho: #b8861a; --s-deu: #478dcd; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17110e; --surface: #241b16; --surface-2: #2f241e; --ink: #f4e9df; --ink-2: #d0bdb0; --muted: #9c8a7d; --line: #3b2e26;
  --accent: #d9a67c; --accent-ink: #1d1410; --accent-soft: #3a2a20;
  --hero-a: #6a4430; --hero-b: #2a1d16; --hero-ink: #fbefe4; --hero-mut: #d6bfad; --hero-line: rgb(255 240 225 / .14);
  --pos: #6cc196; --neg: #f08a7e; --warn: #f2b65a; --warn-soft: #3a2c12; --seq: #1a9d90; --other: #6e5e53;
  --s-ing: #1a9d90; --s-fijos: #e06a44; --s-var: #a46aba; --s-aho: #b8861a; --s-deu: #478dcd; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 120px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.period { display: flex; align-items: center; gap: 2px; }
.period button.arrow { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 10px; font-size: 20px; color: var(--ink-2); }
.period button.arrow:hover { background: var(--surface-2); }
.period .label { font-family: var(--display); font-weight: 500; font-size: 17px; min-width: 140px; text-align: center; text-transform: capitalize; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.hero { padding-block: 18px 6px; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 10vw, 46px); letter-spacing: -0.02em; line-height: 1.05; }
.big.neg { color: var(--neg); }
.sub { color: var(--ink-2); font-size: 14px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-block: 14px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; border: 0; text-align: left; }
.tile .k { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.tile .v { font-weight: 700; font-size: 17px; }
.tile .p { font-size: 12px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

section.block { margin-block: 22px; display: grid; gap: 10px; }
h2 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 0; text-wrap: balance; }
.card { background: var(--surface); border-radius: var(--r); padding: 6px 14px; }

.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.cat:last-child { border-bottom: 0; }
.cat .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.cat .a { font-weight: 600; text-align: right; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.cat .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.cat .meta.over { color: var(--neg); font-weight: 600; }

.tx { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding-block: 11px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-inline: 0; border-top: 0; text-align: left; }
.tx:last-child { border-bottom: 0; }
.tx .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.tx .t { min-width: 0; }
.tx .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .m { font-weight: 600; text-align: right; white-space: nowrap; }
.tx .m.in { color: var(--pos); }
.tx .m small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }
.day { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 14px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }

.empty { padding: 28px 8px; text-align: center; color: var(--ink-2); display: grid; gap: 6px; }
.empty b { font-family: var(--display); font-weight: 500; font-size: 17px; color: var(--ink); }
.notice { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: none; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 7; right: max(16px, calc(50% - 264px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 54px; padding: 0 20px 0 16px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.fab svg { width: 22px; height: 22px; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / .4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 0; }
.sheet h3 { font-family: var(--display); font-weight: 500; font-size: 19px; margin: 0; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.amount { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 10px 14px; }
.amount span { font-family: var(--display); font-size: 22px; color: var(--muted); }
.amount input { border: 0; background: transparent; font-family: var(--display); font-weight: 700; font-size: 36px; width: 100%; min-width: 0; outline: none; font-variant-numeric: tabular-nums; }
.amount-preview { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.inp { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.typepick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.typepick button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.typepick button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 15px; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--neg); flex: 0 0 auto; padding-inline: 10px; }
.btn.danger.confirm { background: var(--neg); color: #fff; }
.btn:disabled { opacity: .5; }
.err { color: var(--neg); font-size: 13.5px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }

/* annual chart */
.chart { background: var(--surface); border-radius: var(--r); padding: 14px 10px 8px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding: 4px 6px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.readout { font-size: 13.5px; color: var(--ink-2); padding: 6px 6px 2px; min-height: 2.6em; }
.readout b { color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.sel td { background: var(--accent-soft); }
.scrollx { overflow-x: auto; }

/* settings */
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats .chip button { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); font-size: 15px; line-height: 1; }
.addcat { display: flex; gap: 6px; }
.addcat input { flex: 1; min-width: 0; }
.addcat button { border: 0; border-radius: 12px; background: var(--surface-2); padding: 0 14px; font-weight: 600; }
.budget { display: grid; grid-template-columns: 1fr 130px; gap: 8px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--line); }
.budget:last-child { border-bottom: 0; }
.budget input { padding: 8px 10px; text-align: right; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bal { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.bal .v { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 6vw, 28px); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.bal .v.neg { color: var(--neg); }
.tbl td:first-child { white-space: normal; }
.tbl tr.total td { font-weight: 700; border-top: 1.5px solid var(--ink); }
.tbl tr.strong td { font-weight: 700; }
.tbl td.neg { color: var(--neg); }
.tbl td.zero { color: var(--muted); }
.tbl td small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.tbl td.over small { color: var(--neg); }
.tbl th.cur { width: 34%; }
.card.tight { padding: 4px 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.notice.warn { background: var(--warn-soft); color: var(--warn); border: 0; width: 100%; text-align: left; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.note { font-size: 12.5px; color: var(--muted); }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg.full { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
.seg.full button { padding: 9px 6px; }
.seg.full.two-opt { grid-template-columns: 1fr 1fr; }
.chiprow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chiprow .chip { flex: none; }
.setrow { display: grid; grid-template-columns: 1fr 140px; gap: 8px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow input.inp { text-align: right; padding: 8px 10px; }
.setrow input[type=checkbox] { justify-self: end; width: 22px; height: 22px; accent-color: var(--accent); }

.tbl td.good { color: var(--pos); }
.tbl.tap tr[data-fcat] { cursor: pointer; }
.tbl.tap tr[data-fcat]:hover td, .tbl.heat tr[data-fcat]:hover td:first-child { background: var(--surface-2); }
.tbl.tap tr[data-fcat] td:first-child::after { content: " ›"; color: var(--muted); }
.tbl.heat tr[data-fcat] { cursor: pointer; }
.tbl.heat td, .tbl.heat th { text-align: center; padding: 8px 6px; font-size: 12px; min-width: 44px; }
.tbl.heat td:first-child, .tbl.heat th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); min-width: 120px; font-size: 13px; }
.chart h3.ch { font-family: var(--display); font-weight: 500; font-size: 15px; margin: 0 6px 4px; }
.sw-line { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.readout.card { padding: 10px 14px; }
input.inp.mini { padding: 6px 8px; text-align: right; width: 100%; min-width: 90px; font-size: 13.5px; }

/* tarjeta principal */
.heros { display: grid; grid-auto-flow: column; grid-auto-columns: 88%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; scrollbar-width: none; padding-block: 4px; }
.heros::-webkit-scrollbar { display: none; }
.hero-card { scroll-snap-align: start; position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 16px; color: var(--hero-ink); background: radial-gradient(120% 90% at 100% 0%, rgb(255 220 190 / .22), transparent 55%), linear-gradient(140deg, var(--hero-a), var(--hero-b)); box-shadow: 0 10px 28px rgb(61 42 32 / .22); display: grid; gap: 10px; min-width: 0; }
.hero-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero-card .cur { font-weight: 700; font-size: 12px; letter-spacing: .12em; padding: 4px 10px; border-radius: 8px; background: var(--hero-line); }
.hero-card .lbl { font-size: 13px; color: var(--hero-mut); }
.hero-card .amt { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 9.5vw, 44px); letter-spacing: -0.02em; line-height: 1; overflow-wrap: anywhere; }
.hero-card .amt.neg { color: #ffb4a6; }
.hero-card .split { font-size: 13px; color: var(--hero-mut); }
.hero-card .split b { color: var(--hero-ink); font-weight: 600; }
.meter { height: 8px; border-radius: 6px; background: var(--hero-line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #f2c49b, #ffe3c9); transform-origin: left; }
.meter.over i { background: linear-gradient(90deg, #ff9b85, #ffc2b5); }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--hero-line); padding-top: 10px; }
.trio div { display: grid; gap: 1px; min-width: 0; }
.trio span { font-size: 11.5px; color: var(--hero-mut); }
.trio b { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.dots { display: flex; justify-content: center; gap: 6px; padding-top: 8px; }
.dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
.dots button[aria-current="true"] { width: 20px; border-radius: 4px; background: var(--accent); }
/* dona */
.donut-wrap { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 10px; background: var(--surface); border-radius: var(--r); padding: 14px; }
@media (min-width: 520px) { .donut-wrap { grid-template-columns: 160px 1fr; align-items: center; } }
.donut { width: 150px; height: 150px; }
.donut text { fill: var(--ink); font-family: var(--display); }
.legend-list { display: grid; gap: 2px; min-width: 0; width: 100%; }
.legend-list button { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; border: 0; background: none; padding: 6px 4px; border-radius: 8px; text-align: left; min-width: 0; }
.legend-list button:hover { background: var(--surface-2); }
.legend-list .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.legend-list .v { font-size: 13px; font-weight: 600; text-align: right; }
.legend-list .v small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
/* plegables */
details.acc { background: var(--surface); border-radius: var(--r); }
details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; font-family: var(--display); font-weight: 500; font-size: 16px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .sum { font-family: var(--body); font-size: 12.5px; color: var(--muted); font-weight: 500; margin-left: auto; text-align: right; }
details.acc > summary svg { flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
details.acc[open] > summary svg { transform: rotate(180deg); }
details.acc > .acc-body { padding: 0 6px 10px; display: grid; gap: 14px; }
details.acc .block { margin-block: 0; }
details.acc .card { background: transparent; }
.accs { display: grid; gap: 10px; margin-block: 22px; }
/* movimiento */
.enter .block, .enter .heros, .enter .accs { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
.enter .block:nth-of-type(2) { animation-delay: .04s; } .enter .block:nth-of-type(3) { animation-delay: .08s; } .enter .block:nth-of-type(4) { animation-delay: .12s; }
.enter .meter i, .enter .bar i { animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }
.enter .donut { animation: pop .6s cubic-bezier(.2,.7,.2,1) both; }
.enter .chart svg g rect, .enter .chart svg g line { animation: riseY .7s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: bottom; }
@keyframes rise { from { transform: translateY(10px); opacity: .35; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes pop { from { transform: scale(.9) rotate(-20deg); opacity: .4; } }
@keyframes riseY { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) { .enter *, .enter { animation: none !important; } details.acc > summary svg { transition: none; } }
.tx .ic { color: #fff; }
.fab { box-shadow: 0 8px 22px rgb(61 42 32 / .28); }
.tile, .bal, .card, .chart { box-shadow: 0 1px 0 rgb(61 42 32 / .04); }
.loans { display: grid; gap: 10px; }
.pill.loan-pill { background: color-mix(in oklab, var(--s-ing) 16%, transparent); color: var(--ink); }
.loan { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.loan-amt { font-family: var(--display); font-weight: 700; font-size: 22px; }
.loan-amt.ok { color: var(--pos); font-size: 18px; }
.plan { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.plan select { width: auto; padding: 6px 10px; }
.plan-res { color: var(--ink-2); }
details.acc .actions, .loan .actions { flex-wrap: wrap; }
body.locked .fab, body.locked nav.tabs { display: none; }
body.locked .period { visibility: hidden; }
.lock { display: grid; justify-items: center; gap: 12px; text-align: center; padding-block: 48px 24px; max-width: 340px; margin: 0 auto; }
.lock h2 { font-size: 22px; }
.lock-logo { border-radius: 50%; box-shadow: 0 8px 24px rgb(61 42 32 / .18); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { border-radius: 50%; box-shadow: 0 2px 8px rgb(61 42 32 / .15); }
.pin { width: 200px; text-align: center; font-size: 34px; letter-spacing: .6em; padding: 12px 0 12px .6em; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.pin:focus-visible { outline: 2px solid var(--accent); }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="row between">
      <div class="brand"><img class="logo" src="logo.png" alt="" width="34" height="34">Cuentas de Vale</div>
      <div class="sub" id="syncState">Conectando…</div>
    </div>
    <div class="row between">
      <div class="period">
        <button type="button" class="arrow" data-step="-1" aria-label="Anterior">‹</button>
        <div class="label" id="periodLabel">—</div>
        <button type="button" class="arrow" data-step="1" aria-label="Siguiente">›</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>

<button type="button" class="fab" id="fab" aria-label="Agregar movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Anotar
</button>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button type="button" data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Mes</button>
  <button type="button" data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Movimientos</button>
  <button type="button" data-tab="anio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>Análisis</button>
  <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
(() => {
  /* ---------- lógica ---------- */
  const CURS = ['COP', 'USD'];
  const sumIf = (list, pred) => list.reduce((a, t) => pred(t) ? a + (Number(t.monto) || 0) : a, 0);
  const DEUDA_TC = 'TC del Mes Pasado', PAGO_TC = 'Pago a TC', GASTO_AHORROS = 'Gasto de Ahorros', REEMBOLSO = 'Reembolso', RETIRO = 'Retiro de ahorros';
  const CREDITO = 'Tarjeta de Crédito', DEBITO = 'Tarjeta Débito';
  const GASTO = new Set(['Gastos Fijos', 'Gastos Variables']);
  const ymOf = (y, m) => `${y}-${String(m).padStart(2, '0')}`;

  function impVal(t) {
    const v = t.impuesto;
    if (v === true || v === 'Si' || v === 'Sí') return 'Si';
    if (v === 'No') return 'No';
    return 'No Aplica';
  }
  // Retiro de ahorros: un ahorro negativo. Los registros viejos de "Gasto de Ahorros" como ingreso se leen igual.
  const isLegacyRetiro = t => t.tipo === 'Ingreso' && t.categoria === GASTO_AHORROS;
  const isReembolso = t => t.tipo === 'Ingreso' && (!!t.reembolsaA || t.categoria === REEMBOLSO);
  const tipoGasto = (cat, cfg) => (cfg?.categorias?.['Gastos Fijos'] || []).includes(cat) ? 'Gastos Fijos' : 'Gastos Variables';
  const tipoRe = (t, cfg) => t.reembolsaTipo || tipoGasto(t.reembolsaA, cfg);
  const isExtra = (t, cfg) => GASTO.has(t.tipo) && t.categoria !== PAGO_TC && (t.extra === true || (cfg?.extraCats || []).includes(t.categoria));
  const isCompraTC = t => t.medio === CREDITO && t.tipo !== 'Deudas';
  const isPrestamo = t => t.tipo === 'Deudas' && t.categoria !== DEUDA_TC && t.categoria !== CREDITO;

  // Totales de un conjunto de movimientos de una sola moneda.
  function totales(L, cfg) {
    const porCat = {};
    const add = (k, v) => { porCat[k] = (porCat[k] || 0) + v; };
    let reembolsos = 0;
    for (const t of L) {
      const v = Number(t.monto) || 0;
      if (isLegacyRetiro(t)) { add('Ahorros|' + RETIRO, -v); continue; }
      if (isReembolso(t)) { reembolsos += v; if (t.reembolsaA) add(tipoRe(t, cfg) + '|' + t.reembolsaA, -v); else add('Gastos Variables|Otros reembolsos', -v); continue; }
      add(t.tipo + '|' + t.categoria, v);
    }
    const byTipo = tipo => Object.entries(porCat).reduce((a, [k, v]) => k.startsWith(tipo + '|') ? a + v : a, 0);
    const pagoTC = porCat['Gastos Fijos|' + PAGO_TC] || 0;
    const ingreso = byTipo('Ingreso');
    const fijos = byTipo('Gastos Fijos') - pagoTC;
    const variables = byTipo('Gastos Variables');
    const ahorros = byTipo('Ahorros');
    const prestamos = sumIf(L, isPrestamo);
    const extraordinario = sumIf(L, t => isExtra(t, cfg));
    const gastado = fijos + variables;
    return {
      n: L.length, porCat, ingreso, reembolsos, pagoTC, fijos, variables, ahorros, prestamos, gastado,
      extraordinario, recurrente: gastado - extraordinario,
      balance: ingreso - (fijos + variables + ahorros + prestamos),
      tasaAhorro: ingreso > 0 ? ahorros / ingreso : null,
      comprasTC: sumIf(L, isCompraTC),
      pendientes: L.filter(t => impVal(t) === 'No').length,
    };
  }

  // Movimiento de la cuenta débito en un conjunto de movimientos (misma fórmula de la hoja Anual).
  function flujoDebito(L, cur, cfg) {
    const deb = cfg?.debito?.[cur] || {};
    const ahorrosNetos = sumIf(L, t => t.tipo === 'Ahorros') - sumIf(L, isLegacyRetiro);
    return sumIf(L, t => t.tipo === 'Ingreso' && !isLegacyRetiro(t))
      - sumIf(L, t => t.medio === DEBITO && t.tipo !== 'Ingreso' && t.tipo !== 'Ahorros')
      - (deb.restaAhorros ? ahorrosNetos : 0);
  }
  // Saldo de la cuenta débito al cierre de un mes: parte del último saldo real anotado antes de ese mes.
  function saldoDebito(all, cur, mesKey, cfg, saldos) {
    const anclas = Object.keys(saldos || {}).filter(k => k < mesKey && Number.isFinite(saldos[k]?.[cur])).sort();
    const ancla = anclas.at(-1);
    const base = ancla ? saldos[ancla][cur] : (Number(cfg?.debito?.[cur]?.inicial) || 0);
    const L = all.filter(t => t.moneda === cur && t.mes && t.mes <= mesKey && (!ancla || t.mes > ancla));
    return base + flujoDebito(L, cur, cfg);
  }
  // Saldo pendiente en la tarjeta de crédito al cierre de un mes: compras con TC − pagos a TC acumulados.
  function saldoTC(all, cur, mesKey, cfg) {
    const L = all.filter(t => t.moneda === cur && t.mes && t.mes <= mesKey);
    return (Number(cfg?.tcInicial?.[cur]) || 0) + sumIf(L, isCompraTC) - sumIf(L, t => t.tipo === 'Gastos Fijos' && t.categoria === PAGO_TC);
  }

  // Préstamos de tus ahorros: lo que sacaste de tus ahorros y vas a devolver, menos lo que ya devolviste.
  const esPrestamo = t => /^Préstamo/.test(t.prestamo || '');
  const esDevolucion = t => t.prestamo === 'Devolución';
  const fondoDe = t => (String(t.prestamo || '').split(':')[1] || '').trim();
  function prestamosAhorros(all, cur, hastaMes) {
    const L = all.filter(t => t.moneda === cur && t.mes && (!hastaMes || t.mes <= hastaMes));
    const abs = t => Math.abs(Number(t.monto) || 0);
    const tomado = L.filter(esPrestamo).reduce((a, t) => a + abs(t), 0);
    const devuelto = L.filter(esDevolucion).reduce((a, t) => a + abs(t), 0);
    const porFondo = {};
    L.filter(esPrestamo).forEach(t => { const f = fondoDe(t) || 'Sin fondo'; porFondo[f] = (porFondo[f] || 0) + abs(t); });
    L.filter(esDevolucion).forEach(t => { const f = t.categoria || 'Sin fondo'; porFondo[f] = (porFondo[f] || 0) - abs(t); });
    return { tomado, devuelto, deuda: tomado - devuelto, porFondo };
  }

  function mensual(all, y, m, cur, cfg, saldos) {
    const k = ymOf(y, m);
    const r = totales(all.filter(t => t.mes === k && t.moneda === cur), cfg);
    r.saldoTC = saldoTC(all, cur, k, cfg);
    r.cupo = Number(cfg?.cupoTC?.[cur]) || 0;
    r.cupoDisponible = r.cupo ? r.cupo - r.saldoTC : null;
    r.debito = saldoDebito(all, cur, k, cfg, saldos);
    r.debitoReal = saldos?.[k]?.[cur];
    // Lo que quedó en la cuenta débito al cerrar el mes anterior: el saldo real si lo anotaste, si no el calculado.
    const ant = new Date(y, m - 2, 1), ka = ymOf(ant.getFullYear(), ant.getMonth() + 1);
    const realAnt = saldos?.[ka]?.[cur];
    r.saldoAnterior = Number.isFinite(realAnt) ? realAnt : saldoDebito(all, cur, ka, cfg, saldos);
    r.saldoAnteriorReal = Number.isFinite(realAnt);
    r.traes = cfg?.traerSaldo?.[cur] === false ? 0 : r.saldoAnterior;
    r.disponible = r.traes + r.balance;
    const PA = prestamosAhorros(all, cur, k), Lm = all.filter(t => t.mes === k && t.moneda === cur);
    r.debesAhorros = PA.deuda; r.tomadoAhorros = PA.tomado; r.devueltoAhorros = PA.devuelto; r.porFondo = PA.porFondo;
    r.prestadoMes = Lm.filter(esPrestamo).reduce((a, t) => a + Math.abs(Number(t.monto) || 0), 0);
    r.devueltoMes = Lm.filter(esDevolucion).reduce((a, t) => a + Math.abs(Number(t.monto) || 0), 0);
    return r;
  }
  function anual(all, y, cur, cfg, saldos) {
    const r = totales(all.filter(t => t.anio === y && t.moneda === cur), cfg);
    const fin = ymOf(y, 12);
    r.ahorrosAcum = sumIf(all.filter(t => t.anio <= y && t.moneda === cur), t => t.tipo === 'Ahorros') - sumIf(all.filter(t => t.anio <= y && t.moneda === cur), isLegacyRetiro);
    r.debito = saldoDebito(all, cur, fin, cfg, saldos);
    r.saldoTC = saldoTC(all, cur, fin, cfg);
    r.debesAhorros = prestamosAhorros(all, cur, fin).deuda;
    return r;
  }
  // Promedio mensual por categoría de gasto: los últimos meses anteriores (hasta 6) que tienen GASTOS
  // en esa moneda. Un mes sin gastos (por ejemplo, solo un aporte a ahorros) no cuenta, para no
  // dividir entre meses vacíos. Una categoría sin gasto en un mes contado suma 0 ese mes.
  function promedios(all, y, m, cur, cfg) {
    const meses = [], claves = [];
    const esGasto = k => GASTO.has(k.split('|')[0]) && !k.endsWith('|' + PAGO_TC);
    for (let i = 1; meses.length < 6 && i <= 36; i++) {
      const d = new Date(y, m - 1 - i, 1), k = ymOf(d.getFullYear(), d.getMonth() + 1);
      const L = all.filter(t => t.mes === k && t.moneda === cur);
      if (!L.length) continue;
      const r = totales(L, cfg);
      if (!Object.entries(r.porCat).some(([c, v]) => esGasto(c) && Math.abs(v) > 0.005)) continue;
      meses.push(r); claves.push(k);
    }
    const prom = {};
    for (const r of meses) for (const [k, v] of Object.entries(r.porCat)) if (esGasto(k)) prom[k] = (prom[k] || 0) + v;
    for (const k of Object.keys(prom)) prom[k] /= meses.length;
    return { prom, n: meses.length, meses: claves.reverse() };
  }

  const TYPES = [
    { id: 'Ingreso', short: 'Ingresos', color: 'var(--s-ing)', ab: 'IN' },
    { id: 'Gastos Fijos', short: 'Gastos fijos', color: 'var(--s-fijos)', ab: 'GF' },
    { id: 'Gastos Variables', short: 'Gastos variables', color: 'var(--s-var)', ab: 'GV' },
    { id: 'Ahorros', short: 'Ahorros', color: 'var(--s-aho)', ab: 'AH' },
    { id: 'Deudas', short: 'Préstamos', color: 'var(--s-deu)', ab: 'PR' },
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.id, t]));
  const IMP = [['No Aplica', 'No aplica'], ['Si', 'Sí'], ['No', 'No · pendiente']];
  const DEFAULT_SETTINGS = {
    categorias: {
      'Ingreso': ['CEO US UNIVERSITY', 'SCCOT', 'CLEMI', 'Ingreso Independiente', 'Ingreso por Inversión', 'Regalo', 'Gasto de Ahorros', 'Transferencia Entrante', 'Viáticos', 'Mono García'],
      'Gastos Fijos': ['Arriendo', 'Servicios Públicos', 'Internet', 'Plan de Celular', 'Seguro de Salud', 'Matrícula de la Universidad', 'Suscripción Gimnasio', 'Pago a TC', 'Pago Nomina'],
      'Gastos Variables': ['Mercado', 'Restaurantes', 'Ropa', 'Medicamentos', 'Entretenimiento', 'Regalos', 'Salón de Belleza', 'Decoración de la Casa', 'Viajes', 'Transporte', 'Empresa', 'Transferencia Saliente', 'Perfume y accesorios'],
      'Ahorros': ['Fondo de Emergencia', 'Ahorro mi Casita', 'Fondo de Inversion'],
      'Deudas': ['Tarjeta de Crédito', 'Préstamo Personal', 'Préstamo Estudiantiles', 'Préstamo Empresarial', 'TC del Mes Pasado'],
    },
    medios: ['Tarjeta de Crédito', 'Tarjeta Débito', 'NA'],
    presupuesto: { COP: {}, USD: {} },
    cupoTC: { COP: 0, USD: 2500 },
    tcInicial: { COP: 0, USD: 0 },
    debito: { COP: { inicial: 0, restaAhorros: true }, USD: { inicial: 1123.25, restaAhorros: false } },
    extraCats: ['Viajes', 'Matrícula de la Universidad'],
    traerSaldo: { COP: true, USD: true },
    planAhorros: { COP: 3, USD: 3 },
  };
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MON3 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const FIRST_YEAR = 2025;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('cv.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('cv.' + k, JSON.stringify(v)); } catch {} },
  };
  const now = new Date();
  const S = {
    year: now.getFullYear(), month: now.getMonth() + 1,
    cur: store.get('cur', 'USD'), tab: store.get('tab', 'mes'), showZeros: store.get('zeros', false),
    loaded: false, all: [], saldos: {},
    settings: DEFAULT_SETTINGS,
    fCur: 'all', fType: 'all', fPend: false, fCat: null, fSin: false, fPrest: false, categorias: null, open: store.get('open', {}),
    q: '', selMonth: null,
    cola: store.get('cola', []), // movimientos que no se pudieron guardar en la hoja
  };

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtCache = {};
  const fmt = (n, cur) => {
    if (!CURS.includes(cur)) return (Number(n) || 0).toLocaleString('es-CO', { maximumFractionDigits: 2 });
    fmtCache[cur] ||= new Intl.NumberFormat('es-CO', { style: 'currency', currency: cur, currencyDisplay: cur === 'USD' ? 'symbol' : 'narrowSymbol', minimumFractionDigits: cur === 'COP' ? 0 : 2, maximumFractionDigits: cur === 'COP' ? 0 : 2 });
    return fmtCache[cur].format(Math.abs(n) < 0.005 ? 0 : (n || 0));
  };
  const pct = v => v == null || !Number.isFinite(v) ? '—' : Math.round(v * 100) + ' %';
  const compact = (n, cur) => {
    const a = Math.abs(n);
    if (cur === 'COP') return a >= 1e6 ? (n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' M' : a >= 1e3 ? Math.round(n / 1e3) + ' mil' : String(Math.round(n));
    return a >= 1e3 ? (n / 1e3).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + 'k' : String(Math.round(n));
  };
  const pad = n => String(n).padStart(2, '0');
  const ym = (y, m) => `${y}-${pad(m)}`;
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dayLabel = f => { if (!f) return 'Sin fecha'; const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: y !== S.year ? 'numeric' : undefined }); };
  const parseAmount = (s, cur) => {
    s = String(s ?? '').replace(/[^\d.,-]/g, '');
    if (!s) return NaN;
    if (cur === 'COP') { const p = s.split(','); return Number(p[0].replace(/\./g, '') + (p[1] ? '.' + p[1] : '')); }
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc > -1) s = (s.length - lc - 1 === 3 && s.indexOf(',') === lc && s.length > 4) ? s.replace(',', '') : s.replace(',', '.');
    return Number(s);
  };
  const cats = t => S.settings.categorias?.[t] || [];
  const gastoCats = () => [...cats('Gastos Variables').map(c => ['Gastos Variables', c]), ...cats('Gastos Fijos').filter(c => c !== PAGO_TC).map(c => ['Gastos Fijos', c])];
  const mergeSettings = d => {
    const o = structuredClone(DEFAULT_SETTINGS);
    for (const [k, v] of Object.entries(d || {})) {
      if (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) {
        for (const [k2, v2] of Object.entries(v)) o[k][k2] = (v2 && typeof v2 === 'object' && !Array.isArray(v2)) ? { ...(o[k][k2] || {}), ...v2 } : v2;
      } else o[k] = v;
    }
    return o;
  };

  let toastT;
  function toast(msg, ms = 2400) {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.append(el); }
    el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, ms);
  }

  /* ---------- datos ---------- */
  // Los datos viven en una hoja de Google Sheets; Apps Script (apps-script/Codigo.gs) es la API.
  // Conexión por código QR: la dirección llega como #conectar=… y se borra de la barra en cuanto se guarda.
  if (location.hash.startsWith('#conectar=')) {
    try { const c = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(10))))); if (c.url && c.clave) store.set('conexion', { url: c.url, clave: c.clave }); } catch {}
    history.replaceState(null, '', location.pathname);
  }
  const CONN = store.get('conexion', null); // { url, clave } guardado solo en este dispositivo

  /* ---------- PIN del dispositivo ---------- */
  // El PIN no sale del dispositivo: se guarda solo su huella (SHA-256 con sal). 5 intentos fallidos desconectan el dispositivo.
  const LOCK = { locked: false, mode: 'abrir', first: '', msg: '' };
  const MAX_FALLOS = 5;
  async function huella(pin, salt) {
    const data = new TextEncoder().encode(salt + ':' + pin);
    if (crypto.subtle) return [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(b => b.toString(16).padStart(2, '0')).join('');
    let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return String(h);
  }
  function olvidarDispositivo(aviso) {
    try { ['cv.conexion', 'cv.cache', 'cv.pin', 'cv.pinFallos'].forEach(k => localStorage.removeItem(k)); if (aviso) localStorage.setItem('cv.aviso', JSON.stringify(aviso)); } catch {}
    location.reload();
  }
  function bloquear(mode, msg = '') { Object.assign(LOCK, { locked: true, mode, first: '', msg }); render(); }
  async function recibirPin(pin) {
    if (LOCK.mode === 'crear') { Object.assign(LOCK, { mode: 'confirmar', first: pin, msg: '' }); return render(); }
    if (LOCK.mode === 'confirmar') {
      if (pin !== LOCK.first) return bloquear('crear', 'Los PIN no coinciden. Escríbelo de nuevo.');
      const salt = crypto.getRandomValues ? [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16)).join('') : String(Math.random());
      store.set('pin', { salt, hash: await huella(pin, salt) }); store.set('pinFallos', 0);
      LOCK.locked = false; render(); toast('PIN guardado'); return;
    }
    const guardado = store.get('pin', null);
    if (guardado && await huella(pin, guardado.salt) === guardado.hash) { store.set('pinFallos', 0); LOCK.locked = false; render(); return; }
    const fallos = (store.get('pinFallos', 0) || 0) + 1; store.set('pinFallos', fallos);
    if (fallos >= MAX_FALLOS) return olvidarDispositivo('Demasiados intentos con el PIN. Por seguridad se desconectó este dispositivo: conéctalo de nuevo con tu clave.');
    bloquear('abrir', `PIN incorrecto. Te ${MAX_FALLOS - fallos === 1 ? 'queda 1 intento' : `quedan ${MAX_FALLOS - fallos} intentos`}.`);
  }
  function viewPin() {
    const titulo = LOCK.mode === 'crear' ? 'Crea un PIN de 4 dígitos' : LOCK.mode === 'confirmar' ? 'Repite tu PIN' : 'Escribe tu PIN';
    const nota = LOCK.mode === 'abrir' ? 'Tus cuentas están bloqueadas en este dispositivo.' : 'Se pedirá cada vez que abras la app en este dispositivo. No se guarda en ningún otro lado.';
    return `<section class="lock"><img class="lock-logo" src="logo.png" alt="Logo VR" width="112" height="112"><h2>${titulo}</h2><div class="note">${nota}</div>
      <input id="pinIn" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="${titulo}">
      <div class="err" role="alert">${esc(LOCK.msg)}</div>
      ${LOCK.mode === 'abrir' ? '<button type="button" class="chip" id="olvidePin">Olvidé mi PIN</button>' : ''}</section>`;
  }
  const isReady = () => S.loaded;
  const setSync = txt => { $('#syncState').textContent = txt; };
  async function api(accion, data = {}) {
    if (!CONN) throw Object.assign(new Error('sin conexión'), { code: 'sin_conexion' });
    const r = await fetch(CONN.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ clave: CONN.clave, accion, ...data }) });
    const texto = await r.text();
    let j;
    try { j = JSON.parse(texto); }
    catch { const m = texto.match(/monospace[^>]*>([^<]+)</); throw Object.assign(new Error(m ? m[1].trim() : 'El programa de Google devolvió un error'), { code: 'google' }); }
    if (!j.ok) throw Object.assign(new Error(j.error || 'error'), { code: j.error });
    return j;
  }
  const incompleto = t => !t.fecha || !t.categoria || !CURS.includes(t.moneda) || !Number(t.monto);
  const withDerived = t => { const ok = !incompleto(t); return { ...t, monto: Number(t.monto) || 0, anio: ok ? Number(String(t.fecha).slice(0, 4)) : NaN, mes: ok ? String(t.fecha).slice(0, 7) : '' }; };
  function applyData(d) {
    const enHoja = new Set((d.movimientos || []).map(t => t.id));
    S.cola = (S.cola || []).filter(t => !enHoja.has(t.id)); store.set('cola', S.cola);
    const colaIds = new Set(S.cola.map(t => t.id));
    S.all = (d.movimientos || []).filter(t => !colaIds.has(t.id)).map(withDerived).concat(S.cola.map(t => withDerived({ ...t, _sinGuardar: true })));
    S.settings = mergeSettings(d.ajustes || {});
    if (d.categorias && Object.values(d.categorias).some(l => l.length)) S.settings.categorias = d.categorias;
    S.categorias = d.categorias || null;
    S.saldos = d.saldos || {};
    S.loaded = true;
  }
  async function cargar() {
    setSync('Actualizando…');
    try {
      const d = await api('cargar');
      applyData(d); store.set('cache', { movimientos: d.movimientos, ajustes: d.ajustes, saldos: d.saldos, categorias: d.categorias });
      setSync('Al día');
    } catch (e) {
      setSync(e.code === 'clave' ? 'Clave incorrecta' : 'Sin conexión · datos guardados en el celular');
      console.warn(e);
    }
    render();
  }
  // Las escrituras van en fila, una tras otra, para no pisarse en la hoja.
  let writing = Promise.resolve(), pendientes = 0;
  function enviar(accion, data, revertir, msgError) {
    pendientes++; setSync('Guardando…');
    writing = writing.then(() => api(accion, data)).then(() => {
      if (--pendientes === 0) { setSync('Al día'); store.set('cache', { movimientos: S.all, ajustes: S.settings, saldos: S.saldos, categorias: S.categorias }); }
    }, e => {
      pendientes--; revertir?.(); render(); setSync(e.code === 'clave' ? 'Clave incorrecta' : 'Sin guardar');
      toast((msgError || 'No se pudo guardar.') + (e.message && !/fetch|network|load/i.test(e.message) ? ` Motivo: ${e.message}` : ' Revisa tu conexión.'), 6000); console.warn(e);
    });
    return writing;
  }
  const nuevoId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const limpiarMov = t => { const o = { ...t }; delete o.anio; delete o.mes; delete o._sinGuardar; return o; };
  async function reintentar() {
    if (!S.cola.length) return;
    setSync('Guardando…');
    try { await api('guardarMovs', { movs: S.cola }); S.cola = []; store.set('cola', []); toast('Guardado en tu hoja'); await cargar(); }
    catch (e) { setSync('Sin guardar'); toast('Todavía no se pudo guardar. Motivo: ' + (e.message || 'sin conexión'), 7000); }
  }
  function saveSettings(next) {
    const prev = S.settings; S.settings = next; render();
    const { categorias, ...sinCategorias } = next;
    enviar('guardarAjustes', { ajustes: JSON.parse(JSON.stringify(sinCategorias)) }, () => { S.settings = prev; }, 'No se pudo guardar el ajuste');
  }
  function saveSaldo(mes, cur, val) {
    const prev = S.saldos;
    const next = { ...(S.saldos[mes] || {}) };
    if (Number.isFinite(val)) next[cur] = val; else delete next[cur];
    S.saldos = { ...S.saldos, [mes]: next }; render();
    enviar('guardarSaldo', { mes, COP: next.COP ?? null, USD: next.USD ?? null }, () => { S.saldos = prev; }, 'No se pudo guardar el saldo');
  }
  function guardarMov(t) {
    const prev = S.all, i = S.all.findIndex(x => x.id === t.id);
    S.all = i >= 0 ? S.all.map(x => x.id === t.id ? withDerived(t) : x) : [...S.all, withDerived(t)];
    render();
    const limpio = limpiarMov(t);
    S.cola = S.cola.filter(x => x.id !== t.id); store.set('cola', S.cola);
    return enviar('guardarMovs', { movs: [limpio] }, () => {
      // No se borra lo que escribiste: queda «Sin guardar» para reintentar.
      S.cola = [...S.cola.filter(x => x.id !== t.id), limpio]; store.set('cola', S.cola);
      S.all = S.all.map(x => x.id === t.id ? { ...x, _sinGuardar: true } : x);
    }, 'No se guardó en tu hoja: quedó marcado «Sin guardar».');
  }
  function borrarMov(id) {
    if (S.cola.some(x => x.id === id)) { S.cola = S.cola.filter(x => x.id !== id); store.set('cola', S.cola); S.all = S.all.filter(x => x.id !== id); render(); return Promise.resolve(); }
    const prev = S.all; S.all = S.all.filter(x => x.id !== id); render();
    return enviar('borrarMov', { id }, () => { S.all = prev; }, 'No se pudo eliminar. Revisa tu conexión.');
  }
  function descargar(nombre, contenido, tipo) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    a.download = nombre; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- piezas ---------- */
  const sortTx = list => list.sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || '')));
  const moneyIn = t => t.tipo === 'Ingreso' || (t.tipo === 'Ahorros' && Number(t.monto) < 0);
  function txRow(t) {
    const ty = TYPE[t.tipo] || { color: 'var(--muted)', ab: '?' };
    const isIn = moneyIn(t);
    const first = isReembolso(t) && t.reembolsaA ? `Reembolso de ${t.reembolsaA}` : (t.categoria || `${t.tipo || 'Movimiento'} sin categoría`);
    const sub = [t.detalle, t.medio && t.medio !== 'NA' ? t.medio.replace('Tarjeta ', 'T. ') : ''].filter(Boolean).join(' · ');
    const pills = (impVal(t) === 'No' ? ' <span class="pill warn">Impuesto pendiente</span>' : '')
      + (isExtra(t, S.settings) ? ' <span class="pill">Extraordinario</span>' : '')
      + (t.tipo === 'Deudas' && t.categoria === DEUDA_TC ? ' <span class="pill">Ya no se usa</span>' : '')
      + (t._sinGuardar ? ' <span class="pill warn">Sin guardar</span>' : '')
      + (incompleto(t) ? ' <span class="pill warn">Incompleto</span>' : '')
      + (esPrestamo(t) ? ' <span class="pill loan-pill">Préstamo de ahorros</span>' : esDevolucion(t) ? ' <span class="pill loan-pill">Devolución a ahorros</span>' : '');
    return `<button type="button" class="tx" data-edit="${esc(t.id)}">
      <span class="ic" style="background:${ty.color}">${ty.ab}</span>
      <span class="t"><b>${esc(first)}</b><span>${esc(sub || t.tipo)}${pills}</span></span>
      <span class="m num ${isIn ? 'in' : ''}">${isIn ? '+' : '−'}${fmt(Math.abs(t.monto), t.moneda)}<small>${esc(t.moneda || '—')}</small></span>
    </button>`;
  }
  const cell = (v, cur, signed) => `<td class="${v == null || Math.abs(v) < 0.005 ? 'zero' : signed && v < 0 ? 'neg' : ''}">${v == null ? '—' : fmt(v, cur)}</td>`;
  const head3 = first => `<thead><tr><th>${first}</th><th class="cur">COP</th><th class="cur">USD</th></tr></thead>`;
  const curSeg = label => `<div class="seg" role="group" aria-label="${label}">${CURS.map(c => `<button type="button" data-cur="${c}" aria-pressed="${S.cur === c}">${c}</button>`).join('')}</div>`;
  const dotH = color => `<span class="dot" style="display:inline-block;background:${color};margin-right:8px;vertical-align:middle"></span>`;

  // Desglose de un tipo con columnas COP | USD. Toca una fila para ver sus movimientos.
  function desglose(tipo, R, totalKey, scope, opts = {}) {
    const list = [...cats(tipo)];
    for (const c of CURS) for (const k of Object.keys(R[c].porCat)) { const [tp, ca] = k.split('|'); if (tp === tipo && !list.includes(ca)) list.push(ca); }
    const budgets = opts.budgets ? S.settings.presupuesto || {} : {};
    const rows = list.map(ca => {
      const v = Object.fromEntries(CURS.map(c => [c, R[c].porCat[tipo + '|' + ca] || 0]));
      const hasBudget = CURS.some(c => budgets[c]?.[ca] > 0);
      if (!S.showZeros && !hasBudget && CURS.every(c => Math.abs(v[c]) < 0.005)) return '';
      const notes = [ca === PAGO_TC ? 'No suma al total: abona a la tarjeta' : '', (S.settings.extraCats || []).includes(ca) ? 'Extraordinario' : '', ca === RETIRO ? 'Plata que sacaste de tus ahorros' : ''].filter(Boolean).join(' · ');
      return `<tr data-fcat="${esc(tipo + '|' + ca)}" data-scope="${scope}"><td>${esc(ca)}${notes ? `<small>${notes}</small>` : ''}</td>${CURS.map(c => {
        const b = budgets[c]?.[ca] || 0, over = b > 0 && v[c] > b;
        return `<td class="${over ? 'over neg' : Math.abs(v[c]) < 0.005 ? 'zero' : ''}">${fmt(v[c], c)}${b > 0 ? `<small>${over ? 'pasado del' : 'tope'} ${fmt(b, c)}</small>` : ''}</td>`;
      }).join('')}</tr>`;
    }).join('');
    const total = `<tr class="total"><td>Total</td>${CURS.map(c => cell(R[c][totalKey], c, true)).join('')}</tr>`;
    return `<section class="block"><h2>${dotH(TYPE[tipo].color)}${opts.title || TYPE[tipo].short}</h2>
      <div class="card tight scrollx"><table class="tbl num tap">${head3('Categoría')}<tbody>${rows || `<tr><td colspan="3" class="zero">Sin movimientos</td></tr>`}${total}</tbody></table></div>
      ${opts.note ? `<div class="note">${opts.note}</div>` : ''}</section>`;
  }

  /* ---------- gráficas ---------- */
  const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
  const CH = { W: 340, H: 190, L: 38, R: 6, T: 12, B: 22 };
  const sel = i => S.selMonth === i + 1;
  function frame(maxV, minV, cur, fmtTick) {
    const { W, H, L, R, T, B } = CH;
    // Marcas en valores redondos (múltiplos de 1, 2 o 5): el eje va de «bot» a «top» en pasos de «step».
    const rango = Math.max(maxV, 0.0001) - Math.min(0, minV), step = Math.min(niceMax(rango / 4), niceMax(rango) / 4);
    const top = Math.ceil(Math.max(maxV, 0.0001) / step) * step;
    const bot = minV >= 0 ? 0 : -minV < step * 0.25 ? minV * 1.3 : -Math.ceil(-minV / step) * step; // un negativo pequeño no merece una marca
    const sy = v => T + (H - T - B) * (top - v) / (top - bot);
    let g = '';
    for (let v = Math.ceil(bot / step - 1e-9) * step; v <= top + step / 2; v += step) { const y = sy(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y + 3}" text-anchor="end">${fmtTick(Math.abs(v) < step / 1000 ? 0 : v)}</text>`; }
    if (bot < 0) g += `<line x1="${L}" x2="${W - R}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--muted)" stroke-width="1"/>`;
    const bw = (W - L - R) / 12;
    for (let i = 0; i < 12; i++) g += `<g data-month="${i + 1}" style="cursor:pointer"><rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="${sel(i) ? 'var(--surface-2)' : 'transparent'}"/><text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" style="${sel(i) ? 'fill:var(--ink);font-weight:700' : ''}">${MON3[i][0]}</text></g>`;
    return { g, sy, bw, x0: i => L + i * bw };
  }
  const svgWrap = (g, label) => `<svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label="${label}" style="pointer-events:auto">${g}</svg>`;

  function chartMesAMes(months, cur) {
    const f = frame(Math.max(1, ...months.map(m => Math.max(Math.max(0, m.fijos) + Math.max(0, m.variables), m.ingreso))), 0, cur, v => v ? compact(v, cur) : '0');
    let g = f.g;
    months.forEach((m, i) => {
      const x = f.x0(i) + f.bw * 0.18, w = f.bw * 0.64, fi = Math.max(0, m.fijos), va = Math.max(0, m.variables);
      const yF = f.sy(fi), yV = f.sy(fi + va);
      g += `<g pointer-events="none">${fi > 0 ? `<rect x="${x}" y="${yF}" width="${w}" height="${Math.max(0, f.sy(0) - yF)}" fill="var(--s-fijos)" rx="1.5"/>` : ''}
        ${va > 0 ? `<rect x="${x}" y="${yV}" width="${w}" height="${Math.max(0, yF - yV - (fi > 0 ? 2 : 0))}" fill="var(--s-var)" rx="1.5"/>` : ''}
        ${m.ingreso > 0 ? `<line x1="${x - 2}" x2="${x + w + 2}" y1="${f.sy(m.ingreso)}" y2="${f.sy(m.ingreso)}" stroke="var(--s-ing)" stroke-width="2.5" stroke-linecap="round"/>` : ''}</g>`;
    });
    return svgWrap(g, `Gastos e ingreso por mes en ${cur}`);
  }
  function chartTasa(months) {
    const vals = months.map(m => m.n && m.tasaAhorro != null ? m.tasaAhorro : null);
    const real = vals.filter(v => v != null);
    const f = frame(Math.max(0.5, ...real), Math.min(0, ...real), null, v => Math.round(v * 100) + '%');
    let g = f.g;
    vals.forEach((v, i) => {
      if (v == null) return;
      const x = f.x0(i) + f.bw * 0.2, w = f.bw * 0.6, y0 = f.sy(0), y1 = f.sy(v);
      g += `<g pointer-events="none"><rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" fill="${v < 0 ? 'var(--neg)' : 'var(--s-aho)'}" rx="1.5"/>
        ${(() => { const dentro = v < 0 && y1 + 10 > CH.H - CH.B; return `<text x="${x + w / 2}" y="${dentro ? y1 - 3 : v < 0 ? y1 + 10 : y1 - 3}" text-anchor="middle" style="fill:${dentro ? '#fff' : 'var(--ink-2)'};font-size:8.5px">${Math.round(v * 100)}%</text>`; })()}</g>`;
    });
    return svgWrap(g, 'Tasa de ahorro por mes');
  }
  function chartTC(months, cur) {
    const f = frame(Math.max(1, ...months.map(m => Math.max(m.comprasTC, m.pagoTC, m.saldoTC))), Math.min(0, ...months.map(m => m.saldoTC)), cur, v => v ? compact(v, cur) : '0');
    let g = f.g, pts = [];
    months.forEach((m, i) => {
      const w = f.bw * 0.32, x = f.x0(i) + f.bw * 0.16;
      if (m.comprasTC > 0) g += `<rect pointer-events="none" x="${x}" y="${f.sy(m.comprasTC)}" width="${w}" height="${f.sy(0) - f.sy(m.comprasTC)}" fill="var(--s-var)" rx="1.5"/>`;
      if (m.pagoTC > 0) g += `<rect pointer-events="none" x="${x + w + 2}" y="${f.sy(m.pagoTC)}" width="${w}" height="${f.sy(0) - f.sy(m.pagoTC)}" fill="var(--s-fijos)" rx="1.5"/>`;
      if (m.n) pts.push([f.x0(i) + f.bw / 2, f.sy(m.saldoTC)]);
    });
    if (pts.length > 1) g += `<polyline pointer-events="none" points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(p => { g += `<circle pointer-events="none" cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
    return svgWrap(g, `Compras y pagos con tarjeta de crédito en ${cur}`);
  }
  function heatmap(monthsTot, cur) {
    const keys = new Set();
    monthsTot.forEach(m => Object.keys(m.porCat).forEach(k => { const t = k.split('|')[0]; if (GASTO.has(t) && !k.endsWith('|' + PAGO_TC)) keys.add(k); }));
    const active = monthsTot.map((m, i) => m.n ? i : -1).filter(i => i >= 0);
    if (!keys.size || !active.length) return '<div class="note">Sin gastos este año en esta moneda.</div>';
    const rows = [...keys].map(k => ({ k, vals: active.map(i => monthsTot[i].porCat[k] || 0) })).map(r => ({ ...r, tot: r.vals.reduce((a, b) => a + b, 0) })).sort((a, b) => b.tot - a.tot);
    return `<div class="card tight scrollx"><table class="tbl num heat"><thead><tr><th>Categoría</th>${active.map(i => `<th>${MON3[i]}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(r => { const mx = Math.max(...r.vals.map(v => Math.max(0, v))) || 1; return `<tr data-fcat="${esc(r.k)}" data-scope="year"><td>${esc(r.k.split('|')[1])}</td>${r.vals.map(v => { const p = Math.max(0, v) / mx; return `<td style="background:color-mix(in oklab, var(--seq) ${Math.round(p * 62)}%, transparent)" title="${esc(fmt(v, cur))}">${Math.abs(v) < 0.005 ? '·' : compact(v, cur)}</td>`; }).join('')}</tr>`; }).join('')}
    </tbody></table></div>`;
  }

  /* ---------- vistas ---------- */
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  const acc = (key, title, sum, body) => `<details class="acc" data-acc="${key}" ${S.open[key] ? 'open' : ''}><summary><span>${title}</span>${sum ? `<span class="sum">${sum}</span>` : ''}${CHEV}</summary><div class="acc-body">${body}</div></details>`;
  const CAT_COLORS = ['var(--s-ing)', 'var(--s-fijos)', 'var(--s-var)', 'var(--s-aho)', 'var(--s-deu)'];
  // Dona de gastos por categoría (las 5 más grandes + «Otras»), con 2px de separación entre porciones.
  function donut(porCat, cur, scope) {
    const items = Object.entries(porCat).filter(([k, v]) => GASTO.has(k.split('|')[0]) && !k.endsWith('|' + PAGO_TC) && v > 0.005).sort((a, b) => b[1] - a[1]);
    const total = items.reduce((a, [, v]) => a + v, 0);
    if (!total) return `<div class="card"><div class="empty"><span>Todavía no hay gastos en ${cur} este mes.</span></div></div>`;
    const top = items.slice(0, 5), resto = items.slice(5).reduce((a, [, v]) => a + v, 0);
    const parts = top.map(([k, v], i) => ({ k, name: k.split('|')[1], v, color: CAT_COLORS[i] }));
    if (resto > 0.005) parts.push({ k: null, name: `Otras (${items.length - 5})`, v: resto, color: 'var(--other)' });
    const R0 = 52, C = 2 * Math.PI * R0, gap = parts.length > 1 ? 2 : 0;
    let off = 0, arcs = '';
    for (const p of parts) {
      const len = Math.max(0.5, p.v / total * C - gap);
      arcs += `<circle r="${R0}" cx="75" cy="75" fill="none" stroke="${p.color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(p.name)}: ${esc(fmt(p.v, cur))}</title></circle>`;
      off += p.v / total * C;
    }
    return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Gastos por categoría en ${cur}">${arcs}
        <text x="75" y="70" text-anchor="middle" style="font-size:11px;fill:var(--muted);font-family:var(--body)">Gastaste</text>
        <text x="75" y="90" text-anchor="middle" style="font-size:${compact(total, cur).length > 6 ? 16 : 19}px;font-weight:700">${esc(compact(total, cur))}</text></svg>
      <div class="legend-list">${parts.map(p => `<button type="button" ${p.k ? `data-fcat="${esc(p.k)}" data-scope="${scope}"` : 'data-tab="movs"'}><span class="dot" style="background:${p.color}"></span><span class="n">${esc(p.name)}</span><span class="v num">${fmt(p.v, cur)}<small>${Math.round(p.v / total * 100)} %</small></span></button>`).join('')}</div></div>`;
  }

  // Sección «Préstamos de tus ahorros»: cuánto debes, avance y plan de pago por moneda.
  function seccionPrestamos(R) {
    const curs = CURS.filter(c => R[c].tomadoAhorros > 0.005 || R[c].devueltoAhorros > 0.005);
    const botones = c => `<div class="actions"><button type="button" class="btn" data-nuevo="prestamo" data-moneda="${c}">Tomar de mis ahorros</button><button type="button" class="btn primary" data-nuevo="devolucion" data-moneda="${c}">Devolver a mis ahorros</button></div>`;
    if (!curs.length) return acc('prestamos', 'Préstamos de tus ahorros', 'Sin préstamos', `<div class="note" style="padding-inline:8px">Si sacas plata de tus ahorros para tener flujo y la vas a reponer, anótala como préstamo. Aquí verás cuánto le debes a tus ahorros y un plan para devolverlo.</div>${botones(S.cur)}`);
    const plan = S.settings.planAhorros || {};
    const cards = curs.map(c => {
      const r = R[c], avance = r.tomadoAhorros > 0 ? Math.min(1, r.devueltoAhorros / r.tomadoAhorros) : 1;
      const meses = Number(plan[c]) || 3, cuota = r.debesAhorros > 0 ? r.debesAhorros / meses : 0;
      const fin = new Date(S.year, S.month - 1 + meses, 1);
      const fondos = Object.entries(r.porFondo).filter(([f, v]) => v > 0.005 && f !== 'Sin fondo');
      return `<div class="loan">
        <div class="row between"><span class="eyebrow">${c}</span>${r.debesAhorros > 0.005 ? '' : '<span class="pill">Al día</span>'}</div>
        <div class="loan-amt num ${r.debesAhorros > 0.005 ? '' : 'ok'}">${r.debesAhorros > 0.005 ? `Le debes ${fmt(r.debesAhorros, c)}` : r.debesAhorros < -0.005 ? `Devolviste ${fmt(-r.debesAhorros, c)} de más` : 'No le debes nada a tus ahorros'}</div>
        <div class="bar" title="Devuelto"><i style="width:${(avance * 100).toFixed(1)}%;background:var(--s-ing)"></i></div>
        <div class="note">Has devuelto ${fmt(r.devueltoAhorros, c)} de ${fmt(r.tomadoAhorros, c)} (${Math.round(avance * 100)} %)${fondos.length ? ` · ${fondos.map(([f, v]) => `${esc(f)}: ${fmt(v, c)}`).join(' · ')}` : ''}</div>
        ${r.prestadoMes || r.devueltoMes ? `<div class="note">En ${MONTHS[S.month - 1]}: tomaste ${fmt(r.prestadoMes, c)} y devolviste ${fmt(r.devueltoMes, c)}.</div>` : ''}
        ${r.debesAhorros > 0.005 ? `<div class="plan"><label for="plan-${c}">Devolverlo en</label>
          <select id="plan-${c}" class="inp" data-plan="${c}">${[1, 2, 3, 4, 6, 9, 12, 18, 24].map(n => `<option value="${n}" ${n === meses ? 'selected' : ''}>${n} mes${n > 1 ? 'es' : ''}</option>`).join('')}</select>
          <span class="plan-res">= <b class="num">${fmt(cuota, c)}</b> al mes, terminas en ${MONTHS[fin.getMonth()]} ${fin.getFullYear()}</span></div>` : ''}
        ${botones(c)}</div>`;
    }).join('');
    return `<section class="block"><h2>Préstamos de tus ahorros</h2><div class="loans">${cards}</div></section>`;
  }

  function viewMes() {
    const k = ym(S.year, S.month);
    const R = Object.fromEntries(CURS.map(c => [c, mensual(S.all, S.year, S.month, c, S.settings, S.saldos)]));
    const total = R.COP.n + R.USD.n;
    const pend = R.COP.pendientes + R.USD.pendientes;
    const sinFecha = S.all.filter(incompleto).length;
    const hasPrest = CURS.some(c => R[c].prestamos);
    const recent = sortTx(S.all.filter(t => t.mes === k)).slice(0, 5);
    const tcCurs = CURS.filter(c => R[c].comprasTC || R[c].pagoTC || Math.abs(R[c].saldoTC) > 0.005 || R[c].cupo);
    const ant = MONTHS[(S.month + 10) % 12];
    // tarjetas principales
    const heroes = CURS.map(c => {
      const r = R[c], entra = r.traes + r.ingreso, usado = entra > 0 ? r.gastado / entra : (r.gastado > 0 ? 1 : 0);
      return `<article class="hero-card" data-hero="${c}">
        <div class="top"><span class="lbl">Disponible en ${MONTHS[S.month - 1]}</span><span class="cur">${c}</span></div>
        <div class="amt num ${r.disponible < -0.005 ? 'neg' : ''}" data-count="${r.disponible}" data-cur="${c}" data-key="disp-${c}">${fmt(r.disponible, c)}</div>
        <div class="split">${r.traes ? `Traes <b class="num">${fmt(r.traes, c)}</b> de ${ant} · ` : ''}balance del mes <b class="num">${fmt(r.balance, c)}</b></div>
        <div class="meter ${usado > 1 ? 'over' : ''}" title="Gastado sobre lo que tenías"><i style="width:${Math.min(100, Math.max(0, usado * 100)).toFixed(1)}%"></i></div>
        <div class="split">Usaste ${Math.round(usado * 100)} % de lo que tenías para el mes${r.prestadoMes > 0.005 ? ` · incluye <b class="num">${fmt(r.prestadoMes, c)}</b> prestado de tus ahorros` : ''}</div>
        <div class="trio"><div><span>Entró</span><b class="num">${compact(r.ingreso, c)}</b></div><div><span>Gastaste</span><b class="num">${compact(r.gastado, c)}</b></div><div><span>Ahorraste</span><b class="num">${pct(r.tasaAhorro)}</b></div></div>
      </article>`;
    }).join('');
    // comparación contra el promedio
    const P = promedios(S.all, S.year, S.month, S.cur, S.settings);
    const este = R[S.cur].porCat;
    const cmpKeys = [...new Set([...Object.keys(P.prom), ...Object.keys(este).filter(x => GASTO.has(x.split('|')[0]) && !x.endsWith('|' + PAGO_TC))])];
    const cmpRows = cmpKeys.map(x => ({ x, e: este[x] || 0, p: P.prom[x] || 0 })).filter(r => Math.abs(r.e) > 0.005 || Math.abs(r.p) > 0.005).sort((a, b) => (b.e - b.p) - (a.e - a.p));
    const delta = r => {
      if (r.p <= 0.005) return r.e > 0 ? '<td class="neg">Nuevo</td>' : '<td class="zero">—</td>';
      const d = (r.e - r.p) / r.p; const up = d > 0.1, down = d < -0.1;
      return `<td class="${up ? 'neg' : down ? 'good' : 'zero'}">${up ? '▲ ' : down ? '▼ ' : ''}${d > 0 ? '+' : ''}${Math.round(d * 100)} %</td>`;
    };
    const subidas = cmpRows.filter(r => r.p > 0.005 && (r.e - r.p) / r.p > 0.1).length;
    const resumen = [
      ['Traes del mes pasado', 'traes', `Saldo de débito al cierre de ${ant}`], ['Ingreso', 'ingreso', 'Sin reembolsos ni retiros de ahorro'], ['Gastos fijos', 'fijos', 'Sin «Pago a TC»'], ['Gastos variables', 'variables', 'Menos lo que te reembolsaron'],
      ['Ahorros', 'ahorros', 'Neto: aportes menos retiros'], ...(hasPrest ? [['Préstamos', 'prestamos', 'Pagos de préstamos']] : []),
    ].map(([l, key, n]) => `<tr><td>${l}<small>${n}</small></td>${CURS.map(c => cell(R[c][key], c, key === 'ahorros' || key === 'traes')).join('')}</tr>`).join('');
    return `<div class="heros" id="heros">${heroes}</div>
      <div class="dots">${CURS.map(c => `<button type="button" data-herogo="${c}" aria-label="Ver ${c}" aria-current="${S.cur === c}"></button>`).join('')}</div>
      ${total ? '' : `<div class="card" style="margin-top:12px"><div class="empty"><b>Sin movimientos en ${MONTHS[S.month - 1]}</b><span>Toca <strong>Anotar</strong> para registrar el primero, o desliza hacia la derecha para ver meses anteriores.</span></div></div>`}
${S.cola.length ? `<section class="block"><button type="button" class="notice warn" data-reintentar="1"><span>${S.cola.length} movimiento${S.cola.length > 1 ? 's' : ''} sin guardar en tu hoja</span><span>Reintentar ›</span></button></section>` : ''}
      ${sinFecha ? `<section class="block"><button type="button" class="notice warn" data-sinfecha="1"><span>${sinFecha} movimiento${sinFecha > 1 ? 's' : ''} de tu hoja ${sinFecha > 1 ? 'están incompletos' : 'está incompleto'} (falta fecha, categoría, monto o moneda) y no se cuenta${sinFecha > 1 ? 'n' : ''}</span><span>Completar ›</span></button></section>` : ''}
      ${pend ? `<section class="block"><button type="button" class="notice warn" data-pending="1"><span>${pend} movimiento${pend > 1 ? 's' : ''} con impuesto pendiente por agregar</span><span>Ver ›</span></button></section>` : ''}
      <section class="block"><div class="sechead"><h2>¿En qué se fue la plata?</h2>${curSeg('Moneda')}</div>${donut(este, S.cur, 'month')}</section>
      ${CURS.some(c => R[c].tomadoAhorros > 0.005 || R[c].devueltoAhorros > 0.005) ? seccionPrestamos(R) : ''}
      ${recent.length ? `<section class="block"><div class="row between"><h2>Últimos movimientos</h2><button type="button" class="chip" data-tab="movs">Ver todos</button></div>
        <div class="card">${recent.map(txRow).join('')}</div></section>` : ''}
      <div class="accs">
      ${CURS.some(c => R[c].tomadoAhorros > 0.005 || R[c].devueltoAhorros > 0.005) ? '' : seccionPrestamos(R)}
      ${acc('cmp', 'Comparado con tu promedio', P.n ? (subidas ? `${subidas} categoría${subidas > 1 ? 's' : ''} por encima` : 'Todo en lo normal') : '', P.n ? `<div class="card tight scrollx"><table class="tbl num tap"><thead><tr><th>Categoría</th><th>Este mes</th><th>Promedio</th><th>Cambio</th></tr></thead><tbody>
          ${cmpRows.map(r => `<tr data-fcat="${esc(r.x)}" data-scope="month"><td>${esc(r.x.split('|')[1])}</td><td>${fmt(r.e, S.cur)}</td><td>${fmt(r.p, S.cur)}</td>${delta(r)}</tr>`).join('') || '<tr><td colspan="4" class="zero">Sin gastos para comparar</td></tr>'}
        </tbody></table></div><div class="note" style="padding-inline:8px">Promedio mensual en ${S.cur} de ${P.n === 1 ? MONTHS[+P.meses[0].slice(5) - 1] : `${MON3[+P.meses[0].slice(5) - 1].toLowerCase()} ${P.meses[0].slice(0, 4)} a ${MON3[+P.meses.at(-1).slice(5) - 1].toLowerCase()} ${P.meses.at(-1).slice(0, 4)}`} (${P.n} mes${P.n > 1 ? 'es' : ''} con gastos en ${S.cur}). ▲ gastaste más de lo normal, ▼ menos.${S.year === now.getFullYear() && S.month === now.getMonth() + 1 ? ` <b>${MONTHS[S.month - 1][0].toUpperCase() + MONTHS[S.month - 1].slice(1)} todavía no termina</b> (día ${now.getDate()} de ${new Date(S.year, S.month, 0).getDate()}): lo normal es que aún vayas por debajo.` : ''}</div>` : `<div class="note" style="padding-inline:8px">Aún no hay meses anteriores en ${S.cur} para comparar.</div>`)}
      ${acc('resumen', 'Resumen en COP y USD', '', `<div class="card tight scrollx"><table class="tbl num">${head3('Tipo')}<tbody>${resumen}
          <tr class="strong"><td>Balance del mes</td>${CURS.map(c => cell(R[c].balance, c, true)).join('')}</tr>
          <tr class="total"><td>Disponible<small>Lo que traes + balance del mes</small></td>${CURS.map(c => cell(R[c].disponible, c, true)).join('')}</tr>
        </tbody></table></div>
        <div class="note" style="padding-inline:8px">Balance = ingreso − gastos fijos − gastos variables − ahorros${hasPrest ? ' − préstamos' : ''}. La deuda de la tarjeta no se resta otra vez: ya está en tus gastos.</div>
        <div class="card tight scrollx"><table class="tbl num">${head3('Para analizar')}<tbody>
          <tr><td>Gasto recurrente<small>Lo que cuesta un mes normal</small></td>${CURS.map(c => cell(R[c].recurrente, c)).join('')}</tr>
          <tr><td>Gasto extraordinario<small>Viajes, matrícula y lo que marques</small></td>${CURS.map(c => cell(R[c].extraordinario, c)).join('')}</tr>
          <tr><td>Tasa de ahorro</td>${CURS.map(c => `<td class="${R[c].tasaAhorro < 0 ? 'neg' : R[c].tasaAhorro == null ? 'zero' : ''}">${pct(R[c].tasaAhorro)}</td>`).join('')}</tr>
          <tr><td>Reembolsos recibidos<small>Ya descontados de tus gastos</small></td>${CURS.map(c => cell(R[c].reembolsos, c)).join('')}</tr>
        </tbody></table></div>`)}
      ${acc('desglose', 'Desglose por categoría', 'COP y USD', `<div class="row between" style="padding-inline:8px"><span class="note">${S.showZeros ? 'Todas las categorías' : 'Solo las que tienen movimientos'}</span><button type="button" class="chip" data-zeros="1">${S.showZeros ? 'Ocultar en cero' : 'Ver todas'}</button></div>
        ${desglose('Ingreso', R, 'ingreso', 'month')}${desglose('Gastos Fijos', R, 'fijos', 'month', { budgets: true })}${desglose('Gastos Variables', R, 'variables', 'month', { budgets: true })}${desglose('Ahorros', R, 'ahorros', 'month')}${hasPrest ? desglose('Deudas', R, 'prestamos', 'month') : ''}`)}
      ${tcCurs.length ? acc('tc', 'Tarjeta de crédito', tcCurs.map(c => R[c].saldoTC > 0.005 ? `Debes ${compact(R[c].saldoTC, c)} ${c}` : R[c].saldoTC < -0.005 ? `A favor ${compact(-R[c].saldoTC, c)} ${c}` : `${c} al día`).join(' · '), `<div class="card tight scrollx"><table class="tbl num"><thead><tr><th></th>${tcCurs.map(c => `<th class="cur">${c}</th>`).join('')}</tr></thead><tbody>
          <tr><td>Compras con TC</td>${tcCurs.map(c => cell(R[c].comprasTC, c)).join('')}</tr>
          <tr><td>Pagos a la TC</td>${tcCurs.map(c => cell(R[c].pagoTC, c)).join('')}</tr>
          <tr class="strong"><td>Saldo pendiente<small>Al cierre del mes; negativo = saldo a favor</small></td>${tcCurs.map(c => cell(R[c].saldoTC, c)).join('')}</tr>
          ${tcCurs.some(c => R[c].cupo) ? `<tr><td>Cupo disponible<small>Cupo de ${tcCurs.filter(c => R[c].cupo).map(c => fmt(R[c].cupo, c)).join(' / ')}</small></td>${tcCurs.map(c => cell(R[c].cupoDisponible, c, true)).join('')}</tr>` : ''}
        </tbody></table></div>`) : ''}
      ${acc('debito', 'Cuenta débito', 'Cuadra con el banco', `<div class="card tight scrollx"><table class="tbl num">${head3('')}<tbody>
          <tr><td>Traes de ${ant}<small>${CURS.map(c => R[c].saldoAnteriorReal ? `${c}: saldo real` : `${c}: calculado`).join(' · ')}</small></td>${CURS.map(c => cell(R[c].saldoAnterior, c, true)).join('')}</tr>
          <tr><td>Saldo según la app<small>Al cierre de ${MONTHS[S.month - 1]}</small></td>${CURS.map(c => cell(R[c].debito, c, true)).join('')}</tr>
          <tr><td>Saldo real del banco<small>Escríbelo para cuadrar</small></td>${CURS.map(c => `<td><input class="inp num mini" id="sr-${c}" data-saldo="${c}" data-mes="${k}" inputmode="decimal" placeholder="—" value="${Number.isFinite(R[c].debitoReal) ? esc(R[c].debitoReal.toLocaleString('es-CO')) : ''}" aria-label="Saldo real ${c}"></td>`).join('')}</tr>
          <tr class="strong"><td>Diferencia<small>Lo que falta por anotar</small></td>${CURS.map(c => Number.isFinite(R[c].debitoReal) ? cell(R[c].debitoReal - R[c].debito, c, true) : '<td class="zero">—</td>').join('')}</tr>
        </tbody></table></div>
        <div class="note" style="padding-inline:8px">El saldo real que anotes aquí es el que traes al mes siguiente. Si no lo anotas, la app lo calcula.</div>`)}
      </div>`;
  }

  function viewMovs() {
    const q = S.q.trim().toLowerCase();
    let list;
    if (S.fSin) list = S.all.filter(incompleto);
    else if (S.fCat) {
      const [tp, ca] = S.fCat.key.split('|');
      list = S.all.filter(t => (S.fCat.scope === 'year' ? t.anio === S.year : t.mes === ym(S.year, S.month)) &&
        ((t.tipo === tp && t.categoria === ca) || (isReembolso(t) && tipoRe(t, S.settings) === tp && t.reembolsaA === ca) || (tp === 'Ahorros' && ca === RETIRO && isLegacyRetiro(t))));
    } else list = q ? S.all.filter(t => [t.categoria, t.detalle, t.tipo, t.medio, t.moneda, t.reembolsaA].join(' ').toLowerCase().includes(q)) : S.all.filter(t => t.mes === ym(S.year, S.month));
    const pendAll = S.all.filter(t => impVal(t) === 'No');
    if (S.fPend) list = (q || S.fCat) ? list.filter(t => impVal(t) === 'No') : pendAll;
    if (S.fPrest) list = S.all.filter(t => esPrestamo(t) || esDevolucion(t));
    if (S.fCur !== 'all') list = list.filter(t => t.moneda === S.fCur);
    if (S.fType !== 'all') list = list.filter(t => t.tipo === S.fType);
    sortTx(list);
    let html = '', last = '';
    for (const t of list) {
      if (t.fecha !== last) { if (last) html += '</div>'; html += `<div class="day">${dayLabel(t.fecha)}</div><div class="card">`; last = t.fecha; }
      html += txRow(t);
    }
    if (last) html += '</div>';
    const scope = S.fPrest ? 'Préstamos y devoluciones de tus ahorros, todos los meses' : S.fSin ? 'Movimientos incompletos: tócalos para completarlos' : S.fCat ? `${S.fCat.key.split('|')[1]} · ${S.fCat.scope === 'year' ? S.year : MONTHS[S.month - 1] + ' ' + S.year}` : S.fPend ? 'Impuesto pendiente, todos los meses' : q ? 'Resultados en todo el registro' : `Movimientos de ${MONTHS[S.month - 1]} ${S.year}`;
    const tot = CURS.filter(c => list.some(t => t.moneda === c)).map(c => {
      const L = list.filter(t => t.moneda === c);
      return `<tr><td>${c}</td><td>${fmt(L.filter(moneyIn).reduce((a, t) => a + Math.abs(t.monto), 0), c)}</td><td>${fmt(L.filter(t => !moneyIn(t)).reduce((a, t) => a + Number(t.monto), 0), c)}</td></tr>`;
    }).join('');
    return `${S.cola.length ? `<section class="block"><button type="button" class="notice warn" data-reintentar="1"><span>${S.cola.length} movimiento${S.cola.length > 1 ? 's' : ''} sin guardar en tu hoja</span><span>Reintentar ›</span></button></section>` : ''}<section class="block">
      ${S.fSin ? `<button type="button" class="chip" data-clearsin="1" aria-pressed="true">Incompletos ✕</button>` : S.fCat ? `<button type="button" class="chip" data-clearcat="1" aria-pressed="true">${esc(S.fCat.key.split('|')[1])} ✕</button>` : `<input class="search" id="q" type="search" placeholder="Buscar: Glovo, Arriendo, Zara…" value="${esc(S.q)}" autocomplete="off">`}
      <div class="seg full" role="group" aria-label="Moneda">${[['all', 'Ambas'], ['COP', 'COP'], ['USD', 'USD']].map(([v, l]) => `<button type="button" data-fcur="${v}" aria-pressed="${S.fCur === v}">${l}</button>`).join('')}</div>
      <div class="chiprow" role="group" aria-label="Filtrar por tipo">
