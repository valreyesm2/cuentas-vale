        <button type="button" class="chip" data-ftype="all" aria-pressed="${S.fType === 'all'}">Todos</button>
        ${TYPES.map(t => `<button type="button" class="chip" data-ftype="${t.id}" aria-pressed="${S.fType === t.id}"><span class="dot" style="background:${t.color}"></span>${t.short}</button>`).join('')}
      </div>
      <div class="chiprow"><button type="button" class="chip" data-pending="toggle" aria-pressed="${S.fPend}">Impuesto pendiente · ${pendAll.length}</button><button type="button" class="chip" data-fprest="1" aria-pressed="${S.fPrest}">Préstamos de ahorros · ${S.all.filter(t => esPrestamo(t) || esDevolucion(t)).length}</button></div>
      <div class="sub">${esc(scope)} · ${list.length} movimiento${list.length === 1 ? '' : 's'}</div>
      ${tot ? `<div class="card tight scrollx"><table class="tbl num"><thead><tr><th>Moneda</th><th>Entradas</th><th>Salidas</th></tr></thead><tbody>${tot}</tbody></table></div>` : ''}
      ${list.length ? html : `<div class="card"><div class="empty"><b>Nada por aquí</b><span>${S.fPend ? 'No tienes impuestos pendientes por agregar.' : q ? 'Prueba con otra palabra.' : 'No hay movimientos con ese filtro.'}</span></div></div>`}
    </section>`;
  }

  function viewAnio() {
    const R = Object.fromEntries(CURS.map(c => [c, anual(S.all, S.year, c, S.settings, S.saldos)]));
    if (!R.COP.n && !R.USD.n) return `<div class="card"><div class="empty"><b>Sin movimientos en ${S.year}</b><span>Usa las flechas de arriba para cambiar de año.</span></div></div>`;
    const cur = S.cur;

  let ultimaVista = '', enterT;
  const cifras = {};
  // Las cifras grandes cuentan hasta su valor cuando cambian.
  function animarCifras() {
    const quieto = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('[data-count]').forEach(el => {
      const to = Number(el.dataset.count), cur = el.dataset.cur, key = el.dataset.key;
      const from = cifras[key] ?? 0; cifras[key] = to;
      if (quieto || Math.abs(from - to) < 0.005) return;
      const t0 = performance.now(), dur = 700;
      const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e, cur); if (k < 1 && el.isConnected) requestAnimationFrame(paso); };
      requestAnimationFrame(paso);
    });
  }

  function render() {
    $('#periodLabel').textContent = S.tab === 'anio' ? String(S.year) : `${MONTHS[S.month - 1]} ${S.year}`;
    document.querySelectorAll('nav.tabs [data-tab]').forEach(b => b.dataset.tab === S.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    const v = $('#view');
    document.body.classList.toggle('locked', !CONN || LOCK.locked);
    if (!CONN) { v.innerHTML = viewConectar(); return; }
    if (LOCK.locked) { v.innerHTML = viewPin(); setTimeout(() => $('#pinIn')?.focus(), 30); return; }
    if (!isReady()) { v.innerHTML = `<div class="card"><div class="empty"><b>Cargando tus cuentas…</b><span>Aquí verás tu balance del mes en COP y USD, el desglose por categoría y tus últimos movimientos.</span></div></div>`; return; }
    const ae = document.activeElement, focusId = ae?.id, caret = ae?.selectionStart;
    if (ae && ae.dataset?.saldo) return; // no redibujar mientras escribe un saldo
    v.innerHTML = S.tab === 'movs' ? viewMovs() : S.tab === 'anio' ? viewAnio() : S.tab === 'ajustes' ? viewAjustes() : viewMes();
    const vista = [S.tab, S.year, S.month, S.tab === 'anio' ? S.cur : ''].join('|');
    if (vista !== ultimaVista) { ultimaVista = vista; v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); clearTimeout(enterT); enterT = setTimeout(() => v.classList.remove('enter'), 900); }
    const h = $('#heros'), card = h?.querySelector(`[data-hero="${S.cur}"]`);
    if (h && card) h.scrollLeft = card.offsetLeft - h.offsetLeft - 16;
    animarCifras();
    if (focusId === 'q') { const q = $('#q'); q?.focus(); try { q.setSelectionRange(caret, caret); } catch {} }
  }

  /* ---------- anotar / editar ---------- */
  function openSheet(tx, preset = null) {
    const edit = !!tx;
    const legacy = tx && isLegacyRetiro(tx);
    const st = {
      tipo: tx?.tipo || store.get('lastTipo', 'Gastos Variables'),
      categoria: tx?.categoria || '',
      moneda: CURS.includes(tx?.moneda) ? tx.moneda : store.get('lastCur', 'USD'),
      medio: tx?.medio || store.get('lastMedio', 'Tarjeta de Crédito'),
      impuesto: tx ? impVal(tx) : store.get('lastImp', 'Si'),
      extra: tx?.extra === true,
      reembolsaA: tx?.reembolsaA || '', reembolsaTipo: tx?.reembolsaTipo || '',
      prestamo: tx ? esPrestamo(tx) : false, fondo: tx ? fondoDe(tx) : '', devolucion: tx ? esDevolucion(tx) : false,
    };
    // Atajos desde «Préstamos de tus ahorros»
    if (preset === 'prestamo') Object.assign(st, { tipo: 'Ingreso', categoria: GASTO_AHORROS, prestamo: true, medio: 'Tarjeta Débito', impuesto: 'No Aplica', moneda: S.cur });
    if (preset === 'devolucion') {
      const r = mensual(S.all, S.year, S.month, S.cur, S.settings, S.saldos);
      const fondo = Object.entries(r.porFondo).filter(([f, v]) => v > 0.005 && cats('Ahorros').includes(f)).sort((a, b) => b[1] - a[1])[0]?.[0] || cats('Ahorros')[0] || '';
      Object.assign(st, { tipo: 'Ahorros', categoria: fondo, devolucion: true, medio: 'Tarjeta Débito', impuesto: 'No Aplica', moneda: S.cur });
      st.cuota = r.debesAhorros > 0 ? Math.round(r.debesAhorros / (Number(S.settings.planAhorros?.[S.cur]) || 3) * 100) / 100 : '';
    }
    const root = $('#sheetRoot');
    const draw = () => {
      const list = cats(st.tipo);
      const medios = [...new Set([...(S.settings.medios || []), ...(tx?.medio ? [tx.medio] : [])])];
      root.querySelector('#typePick').innerHTML = TYPES.map(t => `<button type="button" data-st-tipo="${t.id}" aria-pressed="${st.tipo === t.id}"><span class="dot" style="background:${t.color}"></span>${t.short.replace('Gastos ', '')}</button>`).join('');
      root.querySelector('#catPick').innerHTML = [...new Set([...list, ...(st.categoria && !list.includes(st.categoria) ? [st.categoria] : [])])].map(c => `<button type="button" class="chip" data-st-cat="${esc(c)}" aria-pressed="${st.categoria === c}">${esc(c)}</button>`).join('');
      const isIng = st.tipo === 'Ingreso';
      const esRetiro = isIng && st.categoria === GASTO_AHORROS;
      root.querySelector('#reField').hidden = !isIng || esRetiro;
      root.querySelector('#prField').hidden = !esRetiro;
      root.querySelector('#devField').hidden = st.tipo !== 'Ahorros';
      if (esRetiro) {
        root.querySelector('#prPick').innerHTML = `<button type="button" data-st-pr="1" aria-pressed="${st.prestamo}">Sí, es un préstamo</button><button type="button" data-st-pr="0" aria-pressed="${!st.prestamo}">No, lo gasté</button>`;
        root.querySelector('#fondoWrap').hidden = !st.prestamo;
        root.querySelector('#fondoPick').innerHTML = cats('Ahorros').map(f => `<button type="button" class="chip" data-st-fondo="${esc(f)}" aria-pressed="${st.fondo === f}">${esc(f)}</button>`).join('');
      }
      if (st.tipo === 'Ahorros') root.querySelector('#devPick').innerHTML = `<button type="button" data-st-dev="1" aria-pressed="${st.devolucion}">Sí, es una devolución</button><button type="button" data-st-dev="0" aria-pressed="${!st.devolucion}">No, es ahorro nuevo</button>`;
      if (isIng) root.querySelector('#rePick').innerHTML = `<button type="button" class="chip" data-st-re="|" aria-pressed="${!st.reembolsaA}">No, es ingreso</button>` + gastoCats().map(([tp, c]) => `<button type="button" class="chip" data-st-re="${esc(tp + '|' + c)}" aria-pressed="${st.reembolsaA === c}">${esc(c)}</button>`).join('');
      const isGasto = GASTO.has(st.tipo) && st.categoria !== PAGO_TC;
      const fixedExtra = (S.settings.extraCats || []).includes(st.categoria);
      root.querySelector('#exField').hidden = !isGasto;
      const ex = root.querySelector('#f-extra'); ex.checked = fixedExtra || st.extra; ex.disabled = fixedExtra;
      root.querySelector('#exHelp').textContent = fixedExtra ? `«${st.categoria}» siempre cuenta como extraordinario (lo cambias en Ajustes).` : 'Márcalo si no se repite cada mes.';
      root.querySelector('#retHelp').textContent = st.tipo === 'Ingreso' && st.categoria === GASTO_AHORROS ? 'La app lo cuenta como plata que sacas de tus ahorros, no como ingreso.' : st.categoria === DEUDA_TC ? 'La app ya calcula sola la deuda de la tarjeta; esto solo cuenta en tu hoja.' : '';
      root.querySelector('#curPick').innerHTML = CURS.map(c => `<button type="button" data-st-cur="${c}" aria-pressed="${st.moneda === c}">${c}</button>`).join('');
      root.querySelector('#medioPick').innerHTML = medios.map(m => `<button type="button" class="chip" data-st-medio="${esc(m)}" aria-pressed="${st.medio === m}">${esc(m === 'NA' ? 'No aplica' : m)}</button>`).join('');
      root.querySelector('#impPick').innerHTML = IMP.map(([v, l]) => `<button type="button" data-st-imp="${v}" aria-pressed="${st.impuesto === v}">${l}</button>`).join('');
      root.querySelector('#impHelp').textContent = st.impuesto === 'No' ? 'Quedará marcado como «Impuesto pendiente» hasta que lo cambies a Sí.' : '';

      preview();

    const startAmt = tx && Number(tx.monto) ? tx.monto : (st.cuota || '');
    root.innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="txForm" aria-label="${edit ? 'Editar movimiento' : 'Nuevo movimiento'}" novalidate>
      <div class="grab"></div>
      <div class="row between"><h3>${edit ? 'Editar movimiento' : 'Nuevo movimiento'}</h3><div class="seg" id="curPick" role="group" aria-label="Moneda"></div></div>

      <div class="field"><span class="lab">Tipo</span><div class="typepick" id="typePick"></div></div>

      <div class="field" id="reField" hidden><span class="lab">¿Es un reembolso de un gasto?</span><div class="chips" id="rePick"></div><div class="note">Si te devolvieron plata de un gasto, elige cuál: se resta de ese gasto y no cuenta como ingreso.</div></div>
      <div class="field" id="prField" hidden><span class="lab">¿Lo vas a devolver a tus ahorros?</span><div class="seg full two-opt" id="prPick" role="group" aria-label="Préstamo"></div>

      <div class="field"><span class="lab">Medio de pago</span><div class="chips" id="medioPick"></div></div>

    $('#f-extra').addEventListener('change', e => { st.extra = e.target.checked; });

      if (d.stTipo) { st.tipo = d.stTipo; st.categoria = ''; draw(); }
      else if (d.stCat) { st.categoria = d.stCat; draw(); }
      else if (d.stRe) { [st.reembolsaTipo, st.reembolsaA] = d.stRe.split('|'); draw(); }
      else if (d.stCur) { st.moneda = d.stCur; draw(); }
      else if (d.stMedio) { st.medio = d.stMedio; draw(); }
      else if (d.stImp) { st.impuesto = d.stImp; draw(); }
      else if (d.stPr) { st.prestamo = d.stPr === '1'; draw(); }
      else if (d.stFondo) { st.fondo = st.fondo === d.stFondo ? '' : d.stFondo; draw(); }
      else if (d.stDev) { st.devolucion = d.stDev === '1'; draw(); }
    });
    if (edit) {
      let armed = false;
      $('#delBtn').onclick = async e => {
        const b = e.currentTarget;
        if (!armed) { armed = true; b.textContent = '¿Seguro? Eliminar'; b.classList.add('confirm'); return; }
        b.disabled = true;
        close(); borrarMov(tx.id); toast('Movimiento eliminado');
      };
    }
    $('#txForm').addEventListener('submit', async e => {
      e.preventDefault();
      let monto = Math.round(parseAmount($('#f-monto').value, st.moneda) * 100) / 100;
      const fecha = $('#f-fecha').value, err = $('#formErr');
      if (!Number.isFinite(monto) || monto === 0) { err.textContent = 'Escribe un monto.'; $('#f-monto').focus(); return; }
      if (!st.categoria) { err.textContent = 'Elige una categoría.'; return; }
      const isRe = st.tipo === 'Ingreso' && st.categoria !== GASTO_AHORROS && !!st.reembolsaA;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { err.textContent = 'Elige una fecha.'; return; }
      const data = { fecha, anio: Number(fecha.slice(0, 4)), mes: fecha.slice(0, 7), tipo: st.tipo, categoria: st.categoria, monto, moneda: st.moneda,
        medio: st.medio, impuesto: st.impuesto, detalle: $('#f-detalle').value.trim(), creado: tx?.creado || new Date().toISOString() };
      if (isRe) data.reembolsaA = st.reembolsaA;
      if (GASTO.has(st.tipo) && st.extra && !(S.settings.extraCats || []).includes(st.categoria)) data.extra = true;
      if (st.tipo === 'Ingreso' && st.categoria === GASTO_AHORROS && st.prestamo) data.prestamo = 'Préstamo' + (st.fondo ? ': ' + st.fondo : '');
      if (st.tipo === 'Ahorros' && st.devolucion) data.prestamo = 'Devolución';
      data.id = edit ? tx.id : nuevoId();
      store.set('lastTipo', st.tipo); store.set('lastMedio', st.medio); store.set('lastCur', st.moneda); store.set('lastImp', st.impuesto);
      close(); guardarMov(data);
      toast(edit ? 'Cambios guardados' : `Anotado: ${fmt(Math.abs(monto), st.moneda)} en ${st.categoria}`);
    });
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', async e => {
    const b = e.target.closest('button, [data-month], tr[data-fcat]'); if (!b || b.closest('#sheetRoot')) return;
    const d = b.dataset;
    if (d.fcat) { S.fCat = { key: d.fcat, scope: d.scope || 'month' }; S.fPend = false; S.fType = 'all'; S.q = ''; S.tab = 'movs'; render(); window.scrollTo(0, 0); return; }
    if (d.reintentar) { reintentar(); return; }
    if (d.fprest) { S.fPrest = !S.fPrest; render(); return; }
    if (d.clearcat) { S.fCat = null; render(); return; }
    if (d.clearsin) { S.fSin = false; render(); return; }
    if (d.sinfecha) { S.fSin = true; S.fCat = null; S.fPend = false; S.fType = 'all'; S.fCur = 'all'; S.tab = 'movs'; render(); window.scrollTo(0, 0); return; }
    if (d.cur) { S.cur = d.cur; store.set('cur', S.cur); render(); return; }
    if (d.herogo) { S.cur = d.herogo; store.set('cur', S.cur); const h = $('#heros'), card = h?.querySelector(`[data-hero="${d.herogo}"]`); if (card) h.scrollTo({ left: card.offsetLeft - h.offsetLeft - 16, behavior: 'smooth' }); return; }
    if (d.tab) { S.tab = d.tab; if (d.tab !== 'movs') { S.fCat = null; S.fSin = false; } store.set('tab', S.tab); render(); window.scrollTo(0, 0); return; }
    if (d.step) {
      const k = Number(d.step);
      if (S.tab === 'anio') { S.year += k; S.selMonth = null; render(); return; }
      let m = S.month + k, y = S.year; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      S.month = m; S.year = y; render(); return;
    }
    if (d.edit) { const t = S.all.find(x => x.id === d.edit); if (t) openSheet(t); return; }
    if (d.fcur) { S.fCur = d.fcur; render(); return; }
    if (d.ftype) { S.fType = d.ftype; render(); return; }
    if (d.pending) { S.fPend = d.pending === 'toggle' ? !S.fPend : true; if (d.pending !== 'toggle') { S.tab = 'movs'; S.q = ''; S.fCat = null; window.scrollTo(0, 0); } render(); return; }
    if (d.zeros) { S.showZeros = !S.showZeros; store.set('zeros', S.showZeros); render(); return; }
    if (d.month) { S.selMonth = Number(d.month) === S.selMonth ? null : Number(d.month); render(); return; }
    if (d.openMonth) { S.month = Number(d.openMonth); S.tab = 'mes'; render(); window.scrollTo(0, 0); return; }
    if (d.extracat) {
      const next = structuredClone(S.settings), set = new Set(next.extraCats || []);
      set.has(d.extracat) ? set.delete(d.extracat) : set.add(d.extracat); next.extraCats = [...set];
      saveSettings(next); return;
    }
    if (d.rmcat) {
      const next = structuredClone(S.settings); next.categorias[d.rmcat] = cats(d.rmcat).filter(c => c !== d.cat);
      saveSettings(next); toast(`Quitada: ${d.cat}. Tus movimientos anteriores no cambian.`); return;
    }
    if (d.nuevo) { if (d.moneda) { S.cur = d.moneda; store.set('cur', S.cur); } openSheet(null, d.nuevo); return; }
    if (b.id === 'fab') { if (CONN && S.loaded) openSheet(); else toast('Primero conecta la app con tu hoja de Google.'); return; }
    if (b.id === 'exportCsv') {
      const cols = [['fecha', 'FECHA'], ['tipo', 'TIPO'], ['categoria', 'CATEGORIA'], ['monto', 'MONTO'], ['impuesto', 'IMPUESTO'], ['medio', 'MEDIO DE PAGO'], ['moneda', 'MONEDA'], ['detalle', 'DETALLES'], ['reembolsaA', 'REEMBOLSO DE'], ['extra', 'EXTRAORDINARIO'], ['prestamo', 'PRÉSTAMO AHORROS']];
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [...S.all].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(t => cols.map(([c]) => q(c === 'impuesto' ? impVal(t) : c === 'extra' ? (isExtra(t, S.settings) ? 'Si' : '') : t[c])).join(','));
      descargar(`cuentas-vale-${todayStr()}.csv`, '\ufeff' + [cols.map(c => c[1]).join(','), ...rows].join('\n'), 'text/csv;charset=utf-8');
    }
    if (b.id === 'showQr') {
      const box = $('#qrBox');
      if (!box.hidden) { box.hidden = true; $('#qr').innerHTML = ''; b.textContent = 'Mostrar código QR'; return; }
      if (!window.QRCode) await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = res; sc.onerror = rej; document.head.append(sc); }).catch(() => toast('No se pudo cargar el generador de QR'));
      if (!window.QRCode) return;
      const link = location.origin + location.pathname + '#conectar=' + btoa(unescape(encodeURIComponent(JSON.stringify(CONN))));
      $('#qr').innerHTML = ''; new QRCode($('#qr'), { text: link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      box.hidden = false; b.textContent = 'Ocultar código QR'; return;
    }
    if (b.id === 'cambiarPin') { bloquear('crear'); return; }
    if (b.id === 'olvidePin') {
      if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Se desconectará este dispositivo. Toca otra vez'; return; }
      olvidarDispositivo('Vuelve a conectar este dispositivo con tu clave y crea un PIN nuevo.'); return;
    }
    if (b.id === 'exportJson') {
      descargar(`cuentas-vale-respaldo-${todayStr()}.json`, JSON.stringify({ movimientos: S.all.map(limpiarMov), ajustes: S.settings, saldos: S.saldos }, null, 1), 'application/json');
    }
    if (b.id === 'desconectar') {
      if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = '¿Seguro? Toca otra vez'; return; }
      olvidarDispositivo();
    }
  });
  document.addEventListener('toggle', e => {
    const d = e.target; if (!d.dataset?.acc) return;
    S.open[d.dataset.acc] = d.open; store.set('open', S.open);
  }, true);
  let heroT;
  document.addEventListener('scroll', e => {
    const h = e.target; if (h.id !== 'heros') return;
    clearTimeout(heroT);
    heroT = setTimeout(() => {
      const w = h.firstElementChild.offsetWidth + 10, c = CURS[Math.round(h.scrollLeft / w)];
      if (c && c !== S.cur) { S.cur = c; store.set('cur', c); render(); }
    }, 140);
  }, true);
  let toque = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    toque = (S.tab === 'mes' || S.tab === 'movs') && !e.target.closest('.heros, .scrollx, .chiprow, .donut-wrap, input, .sheet, nav') ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!toque) return;
    const t = e.changedTouches[0], dx = t.clientX - toque.x, dy = t.clientY - toque.y; toque = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45) $(`.period [data-step="${dx > 0 ? -1 : 1}"]`)?.click();
  }, { passive: true });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { S.q = e.target.value; render(); }
    if (e.target.id === 'pinIn') { const v = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = v; if (v.length === 4) { e.target.disabled = true; recibirPin(v); } }
  });
  document.addEventListener('change', async e => {
    const el = e.target, d = el.dataset || {};
    if (d.plan) { const next = structuredClone(S.settings); next.planAhorros = { ...(next.planAhorros || {}), [d.plan]: Number(el.value) }; saveSettings(next); return; }
    if (el.id === 'importFile' && el.files?.[0]) {
      const st = $('#importState');
      try {
        const data = JSON.parse(await el.files[0].text());
        const movs = (data.movimientos || []).filter(t => t && t.id && t.fecha && t.tipo).map(limpiarMov);
        st.textContent = `Importando ${movs.length} movimientos…`;
        for (let i = 0; i < movs.length; i += 200) { await api('guardarMovs', { movs: movs.slice(i, i + 200) }); st.textContent = `Importados ${Math.min(i + 200, movs.length)} de ${movs.length}…`; }
        if (data.ajustes && Object.keys(data.ajustes).length) await api('guardarAjustes', { ajustes: data.ajustes });
        for (const [mes, v] of Object.entries(data.saldos || {})) await api('guardarSaldo', { mes, COP: v.COP ?? null, USD: v.USD ?? null });
        st.textContent = `Listo: ${movs.length} movimientos importados.`; toast('Respaldo importado'); cargar();
      } catch (er) { st.textContent = 'No se pudo importar: ' + (er.message || 'archivo inválido'); }
      el.value = ''; return;
    }
    if (d.saldo) { const n = el.value.trim() ? parseAmount(el.value, d.saldo) : NaN; el.blur(); saveSaldo(d.mes, d.saldo, n); toast(Number.isFinite(n) ? `Saldo real ${d.saldo} guardado` : 'Saldo real borrado'); return; }
    if (d.budget == null && d.set == null) return;
    const next = structuredClone(S.settings), c = S.cur;
    if (d.budget != null) {
      const n = parseAmount(el.value, c); next.presupuesto[c] ||= {};
      if (n > 0) next.presupuesto[c][d.budget] = n; else delete next.presupuesto[c][d.budget];
      saveSettings(next); toast(n > 0 ? `Tope de ${d.budget}: ${fmt(n, c)}` : `Sin tope en ${d.budget}`); return;
    }
    next.debito[c] ||= {}; next.tcInicial ||= {};
    const n = parseAmount(el.value, c);
    if (d.set === 'cupoTC') { next.cupoTC[c] = n > 0 ? n : 0; toast(n > 0 ? `Cupo TC ${c}: ${fmt(n, c)}` : 'Cupo TC sin mostrar'); }
    if (d.set === 'tcInicial') { next.tcInicial[c] = Number.isFinite(n) ? n : 0; toast('Deuda inicial guardada'); }
    if (d.set === 'debitoInicial') { next.debito[c].inicial = Number.isFinite(n) ? n : 0; toast('Saldo inicial guardado'); }
    if (d.set === 'traerSaldo') { next.traerSaldo = { ...(next.traerSaldo || {}), [c]: el.checked }; toast(el.checked ? 'Se traerá el saldo del mes anterior' : 'Ya no se trae el saldo del mes anterior'); }
    if (d.set === 'debitoAhorros') { next.debito[c].restaAhorros = el.checked; toast('Ajuste guardado'); }
    saveSettings(next);
  });
  document.addEventListener('submit', async e => {
    if (e.target.id === 'connForm') {
      e.preventDefault();
      const url = $('#c-url').value.trim(), clave = $('#c-clave').value.trim(), err = $('#connErr'), btn = $('#connBtn');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) { err.textContent = 'La dirección debe empezar por https://script.google.com/macros/s/ y terminar en /exec.'; return; }
      if (!clave) { err.textContent = 'Escribe la clave.'; return; }
      btn.disabled = true; btn.textContent = 'Conectando…'; err.textContent = '';
      try {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ clave, accion: 'cargar' }) });
        const j = await r.json();
        if (!j.ok) throw Object.assign(new Error(j.error), { code: j.error });
        try { localStorage.removeItem('cv.aviso'); } catch {}
        store.set('conexion', { url, clave }); store.set('cache', { movimientos: j.movimientos, ajustes: j.ajustes, saldos: j.saldos, categorias: j.categorias });
        location.reload();
      } catch (er) {
        btn.disabled = false; btn.textContent = 'Conectar';
        err.textContent = er.code === 'clave' ? 'La clave no coincide con la de tu hoja.' : 'No se pudo conectar. Revisa la dirección y que la aplicación web esté publicada para «Cualquier persona».';
      }
      return;
    }
    const f = e.target.closest('[data-addcat]'); if (!f) return;
    e.preventDefault();
    const t = f.dataset.addcat, inp = f.querySelector('input'), v = inp.value.trim();
    if (!v || cats(t).includes(v)) { inp.value = ''; return; }
    const next = structuredClone(S.settings); next.categorias[t] = [...cats(t), v];
    saveSettings(next); toast(`Categoría agregada: ${v}`);
  });

  /* ---------- arranque ---------- */
  if (CONN) {
    LOCK.locked = true; LOCK.mode = store.get('pin', null) ? 'abrir' : 'crear';
    const cache = store.get('cache', null);
    if (cache) applyData(cache);
    render(); cargar();
    // Se vuelve a pedir el PIN si la app estuvo en segundo plano más de un minuto.
    let ocultaDesde = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { ocultaDesde = Date.now(); return; }
      if (store.get('pin', null) && !LOCK.locked && ocultaDesde && Date.now() - ocultaDesde > 60000) bloquear('abrir');
      if (pendientes === 0) (S.cola.length ? reintentar() : cargar());
    });
  } else { setSync('Sin conectar'); render(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
